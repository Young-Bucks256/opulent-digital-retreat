<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Project Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>JSON Data Manager</h1>
            <p>A simple project demonstrating JSON manipulation with HTML, CSS, and JavaScript</p>
        </header>
        
        <main>
            <section class="input-section">
                <h2>Add New Item</h2>
                <form id="itemForm">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category:</label>
                        <select id="category" name="category">
                            <option value="electronics">Electronics</option>
                            <option value="books">Books</option>
                            <option value="clothing">Clothing</option>
                            <option value="food">Food</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="price">Price:</label>
                        <input type="number" id="price" name="price" step="0.01" required>
                    </div>
                    <button type="submit">Add Item</button>
                </form>
            </section>
            
            <section class="display-section">
                <h2>Items List</h2>
                <div class="controls">
                    <button id="exportBtn">Export JSON</button>
                    <button id="clearBtn">Clear All</button>
                </div>
                <div id="itemsList" class="items-container"></div>
            </section>
            
            <section class="json-section">
                <h2>JSON Data</h2>
                <pre id="jsonDisplay" class="json-display"></pre>
            </section>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
